apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: geass
    app.kubernetes.io/managed-by: kustomize
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: geass
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: geass
  replicas: 1
  # The old operator stops before the new one starts. The new operator runs data migrations when it starts, and an old
  # one still reconciling the same objects while it does would write back what the migration just changed; the new one
  # also waits for the old one to let go of leader election before it migrates. With the default (one extra pod
  # allowed) the two would overlap for as long as the new one takes to start. The price is that a new operator that
  # cannot start (data newer than it, a failed migration) finds the old one already gone. The installer puts the old
  # one back when that happens and it is safe (pkg/installer/takeover.go); whoever applies these manifests by hand gets
  # no rollback, and nothing reconciles until the new operator is fixed (the workloads it manages keep running).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: geass
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      # The installer puts the operator's image on the control plane only (it ships inside the installer, not
      # in a registry), so the operator has to run there: scheduled onto a worker, which is possible as soon as
      # one has joined, it sits in ImagePullBackOff and nothing manages the cluster. "Exists" rather than a
      # value because k3s labels control plane nodes "true" and other distributions leave the value empty.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8086
          - --dashboard-bind-address=:8085
        # Dashboard login is required. Create Secret geass-dashboard-auth
        # (see config/samples/geass_dashboard_auth.yaml) or set
        # GEASS_DASHBOARD_PASSWORD / GEASS_DASHBOARD_USERS. Geass does not
        # generate a password.
        image: geass-operator:v0.0.1
        env:
        # Makes the Go runtime collect harder as it nears the container limit (512Mi) instead of being
        # killed for it. Below the limit, so the runtime's own overhead still fits.
        - name: GOMEMLIMIT
          value: 400MiB
        name: manager
        ports:
        - containerPort: 8086
          name: health
          protocol: TCP
        - containerPort: 8085
          name: dashboard
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        # The operator migrates data, after waiting for the operator it replaces, before it serves anything, and that can
        # take minutes on an update. The liveness probe waits for this one, which allows 12 minutes: the longest the
        # migration step is allowed to run (10) and some time to start.
        startupProbe:
          httpGet:
            path: /healthz
            port: 8086
          periodSeconds: 5
          failureThreshold: 144
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8086
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8086
          initialDelaySeconds: 5
          periodSeconds: 10
        # TODO(user): Configure the resources accordingly based on the project requirements.
        # More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 10m
            memory: 128Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
