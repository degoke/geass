---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassdatabases.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassDatabase
    listKind: GeassDatabaseList
    plural: geassdatabases
    singular: geassdatabase
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .spec.engine
      name: Engine
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GeassDatabase is the Schema for the geassdatabases API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GeassDatabaseSpec defines the desired state of GeassDatabase.
            properties:
              backup:
                description: |-
                  Backup configures backups. It applies to in-cluster Postgres (continuous, restorable to any
                  moment), MySQL, MariaDB and SQLite (daily snapshots); nil or disabled leaves the database with no
                  recovery path beyond its own disks.
                properties:
                  enabled:
                    description: Enabled turns continuous backups on. They are stored
                      in the project's backup storage.
                    type: boolean
                  retentionDays:
                    default: 7
                    description: RetentionDays is how many days back the database
                      can be restored.
                    format: int32
                    maximum: 365
                    minimum: 1
                    type: integer
                required:
                - enabled
                type: object
              clusterSize:
                description: |-
                  ClusterSize is the PlanetScale cluster size (for example PS_10) a created database is
                  provisioned with. The sizes PlanetScale offers for an engine are listed by the dashboard API at
                  /api/planetscale/cluster-sizes. It applies when the database is created; changing it
                  afterwards does not resize the database.
                type: string
              connectionRef:
                description: ConnectionRef identifies a GeassCloudConnection used
                  for PlanetScale or AWS.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              databaseName:
                description: DatabaseName overrides the default database name for
                  external or logical-style servers.
                type: string
              deploy:
                description: Deploy gates database provisioning until the user deploys
                  from the dashboard.
                properties:
                  enabled:
                    description: Enabled is true after the user deploys. False keeps
                      the resource as an editable draft.
                    type: boolean
                type: object
              engine:
                description: Engine is the database engine to provision.
                enum:
                - Postgres
                - MySQL
                - SQLite
                - Redis
                - MariaDB
                type: string
              environment:
                description: Environment is the project environment. Empty for the
                  cluster-wide server.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              externalHost:
                description: ExternalHost is the hostname used when connecting to
                  an existing server.
                type: string
              externalPort:
                description: ExternalPort is the port used when connecting to an existing
                  server.
                format: int32
                type: integer
              highAvailability:
                description: |-
                  HighAvailability requests a multi-instance topology. It is only valid when the
                  cluster HA readiness check reports at least three healthy nodes.
                type: boolean
              instances:
                default: 1
                description: Instances is the number of in-cluster instances. HighAvailability
                  forces at least 3.
                format: int32
                minimum: 1
                type: integer
              mode:
                description: Mode selects whether Geass should create a remote database
                  or connect to an existing one.
                enum:
                - Create
                - Connect
                type: string
              org:
                description: |-
                  Org makes a shared server an organization's: the name of a GeassOrganization. Only that organization's projects
                  may take logical databases on it, and only its people see it. It is for a server with no project; one that has a
                  project belongs to the project, and this is ignored. Empty is the platform's: while organizations are on it is for
                  the projects of no organization, so that a server never holds two organizations' data; while they are off every
                  project may use it.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              passwordSecretRef:
                description: PasswordSecretRef points at the Secret that stores the
                  external password.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              placement:
                default: InCluster
                description: Placement selects in-cluster provisioning or an external
                  provider.
                enum:
                - InCluster
                - External
                type: string
              project:
                description: |-
                  Project is the owning project. Leave it empty for the cluster-wide server: one Postgres or MySQL
                  that projects share, each taking logical databases of its own on it (see GeassLogicalDatabase).
                type: string
              provider:
                description: Provider is required when Placement is External.
                enum:
                - PlanetScale
                - AWS
                type: string
              resources:
                description: Resources is the CPU and memory assigned to each in-cluster
                  instance.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              restoreFrom:
                description: |-
                  RestoreFrom creates this database from another database's backups instead of an empty one.
                  It is only read while the database is first provisioned; changing it afterwards has no effect.
                properties:
                  archive:
                    description: Archive is the GeassBackupArchive to restore from.
                    minLength: 1
                    type: string
                  restorePoint:
                    description: RestorePoint is the ID of a restore point listed
                      on the archive.
                    type: string
                  time:
                    description: |-
                      Time restores the database as it was at this moment, which must be inside the archive's
                      recovery window.
                    format: date-time
                    type: string
                required:
                - archive
                type: object
                x-kubernetes-validations:
                - message: set either restorePoint or time, not both
                  rule: '!(has(self.restorePoint) && has(self.time))'
              runOn:
                description: |-
                  RunOn asks for nodes with particular tags, on top of the project's region. It is read when
                  the database is first provisioned: its volumes stay where they were created.
                properties:
                  tags:
                    description: Tags are node tags the workload must run on. A node
                      needs all of them.
                    items:
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                type: object
              serverRegion:
                description: |-
                  ServerRegion is where the cluster-wide server runs. A server with a project follows its
                  project's region instead.
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              storageSize:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  StorageSize is the requested PVC size per instance. Left unset, the engine's
                  default applies (platform.DefaultDatabaseStorage); there is deliberately no
                  CRD default, which could not vary by engine.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
              username:
                description: Username is the login used when connecting to an existing
                  server.
                type: string
              version:
                default: "16"
                description: Version is the engine major version for in-cluster servers.
                type: string
            required:
            - engine
            type: object
          status:
            description: GeassDatabaseStatus defines the observed state of GeassDatabase.
            properties:
              backup:
                description: Backup summarises backup protection. It is absent while
                  backups are off.
                properties:
                  archive:
                    description: Archive is the GeassBackupArchive holding this database's
                      backups.
                    type: string
                  lastBackupTime:
                    description: LastBackupTime is when the most recent backup finished.
                    format: date-time
                    type: string
                  message:
                    description: Message explains the state in plain language.
                    type: string
                  recoveryWindowStart:
                    description: RecoveryWindowStart is the earliest moment the database
                      can be restored to.
                    format: date-time
                    type: string
                  state:
                    description: State is how well the database is protected.
                    enum:
                    - NeedsStorage
                    - Starting
                    - Protected
                    - AtRisk
                    type: string
                required:
                - state
                type: object
              conditions:
                description: conditions represent the current state of the GeassDatabase
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionSecret:
                description: ConnectionSecret is the name of the Secret containing
                  connection credentials.
                type: string
              host:
                description: Host is the in-cluster database hostname.
                type: string
              provision:
                description: Provision tracks deploy attempts and errors for this
                  resource.
                properties:
                  activeProvisionAttempt:
                    description: ActiveProvisionAttempt is the ID of the in-progress
                      attempt, if any.
                    type: string
                  provisionAttempts:
                    description: ProvisionAttempts is recent deploy/provision history
                      (newest first, capped in controller).
                    items:
                      description: GeassProvisionAttempt tracks one deploy/provision
                        run for a resource.
                      properties:
                        buildRef:
                          description: BuildRef links to a GeassBuild for image build
                            logs (services with Git source).
                          type: string
                        completedAt:
                          description: CompletedAt is set when the attempt reaches
                            a terminal phase.
                          format: date-time
                          type: string
                        deploymentRef:
                          description: DeploymentRef links to a GeassDeployment row
                            for this deploy (services).
                          type: string
                        errors:
                          description: Errors lists distinct errors seen during this
                            attempt (newest last).
                          items:
                            description: GeassProvisionAttemptError is one user-safe
                              error recorded during a provision attempt.
                            properties:
                              message:
                                description: Message is product-facing text (no operator
                                  internals).
                                maxLength: 500
                                type: string
                              recordedAt:
                                description: RecordedAt is when this error was observed.
                                format: date-time
                                type: string
                            required:
                            - message
                            - recordedAt
                            type: object
                          maxItems: 12
                          type: array
                        id:
                          description: ID uniquely identifies this attempt within
                            the resource.
                          maxLength: 64
                          type: string
                        phase:
                          description: Phase is Running until the attempt succeeds
                            or fails.
                          enum:
                          - Running
                          - Succeeded
                          - Failed
                          type: string
                        startedAt:
                          description: StartedAt is when provisioning began.
                          format: date-time
                          type: string
                        summary:
                          description: Summary is a short user-facing outcome line
                            when the attempt completes.
                          type: string
                      required:
                      - id
                      - phase
                      - startedAt
                      type: object
                    maxItems: 8
                    type: array
                type: object
              reconcileRetry:
                description: ReconcileRetry tracks provision retries before reconciliation
                  gives up.
                properties:
                  reconcileFailureGeneration:
                    description: ReconcileFailureGeneration is spec generation when
                      provisioning was marked failed.
                    format: int64
                    type: integer
                  reconcileFailureStarted:
                    description: ReconcileFailureStarted is set when ReconcileFailures
                      first increments.
                    format: date-time
                    type: string
                  reconcileFailures:
                    description: ReconcileFailures counts consecutive infrastructure
                      errors while not ready.
                    format: int32
                    type: integer
                type: object
              restoredAt:
                description: |-
                  RestoredAt is when the backups named by spec.restoreFrom were loaded into this database.
                  It is only used by engines that restore by loading a snapshot; it stops the restore from
                  running a second time and overwriting newer data.
                format: date-time
                type: string
              targetNamespace:
                description: TargetNamespace is the namespace workloads were created
                  in.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
