---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassobjectstores.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassObjectStore
    listKind: GeassObjectStoreList
    plural: geassobjectstores
    singular: geassobjectstore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.environment
      name: Environment
      type: string
    - jsonPath: .spec.engine
      name: Engine
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GeassObjectStore is the Schema for the geassobjectstores API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GeassObjectStoreSpec defines the desired state of GeassObjectStore.
            properties:
              buckets:
                description: Buckets is an optional list of buckets to create on provision.
                items:
                  maxLength: 63
                  minLength: 3
                  pattern: ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$
                  type: string
                maxItems: 32
                type: array
                x-kubernetes-validations:
                - message: bucket names must not be formatted as an IP address or
                    contain consecutive periods
                  rule: self.all(b, !b.matches('^[0-9]+[.][0-9]+[.][0-9]+[.][0-9]+$')
                    && !b.contains('..'))
              connectionRef:
                description: ConnectionRef identifies a GeassCloudConnection used
                  for AWS S3.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              createBucket:
                description: CreateBucket requests that Geass create the named buckets
                  when possible.
                type: boolean
              deploy:
                description: Deploy gates bucket provisioning until the user deploys
                  from the dashboard.
                properties:
                  enabled:
                    description: Enabled is true after the user deploys. False keeps
                      the resource as an editable draft.
                    type: boolean
                type: object
              engine:
                description: |-
                  Engine is the object store engine to provision. For a bucket in the cluster it is the engine of the
                  cluster's object storage server. It is chosen once: the server's volume, logins and config belong to the engine
                  it was set up with, so changing it means deleting the object storage and setting it up again.
                enum:
                - SeaweedFS
                - Garage
                - S3
                type: string
                x-kubernetes-validations:
                - message: engine cannot be changed; delete the object storage and
                    set it up again
                  rule: self == oldSelf
              environment:
                description: Environment is the project environment. Required when
                  Project is set.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              placement:
                default: InCluster
                description: Placement selects the cluster's own object storage server
                  or an external S3 provider.
                enum:
                - InCluster
                - External
                type: string
              project:
                description: Project is the owning project. Leave empty for the cluster
                  object storage server.
                type: string
              region:
                description: Region is the AWS region for external buckets.
                type: string
              resources:
                description: Resources is the CPU and memory assigned to the in-cluster
                  object storage server.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runOn:
                description: |-
                  RunOn asks for nodes with particular tags. The cluster object storage server has no project, so
                  this is the only way to choose where it runs.
                properties:
                  tags:
                    description: Tags are node tags the workload must run on. A node
                      needs all of them.
                    items:
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: set
                type: object
              serverRegion:
                description: ServerRegion is where the cluster object storage server
                  runs. Project buckets follow their project instead.
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              storageSize:
                anyOf:
                - type: integer
                - type: string
                description: |-
                  StorageSize is the size of the cluster object storage server's volume. Left unset it is 10Gi. It can
                  be raised later where the cluster's storage can be resized, and never lowered. Only the server has one.
                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                x-kubernetes-int-or-string: true
            required:
            - engine
            type: object
          status:
            description: GeassObjectStoreStatus defines the observed state of GeassObjectStore.
            properties:
              conditions:
                description: conditions represent the current state of the GeassObjectStore
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              connectionSecret:
                description: ConnectionSecret is the name of the Secret containing
                  credentials.
                type: string
              endpoint:
                description: Endpoint is the in-cluster S3-compatible endpoint URL.
                type: string
              provision:
                description: Provision tracks deploy attempts and errors for this
                  resource.
                properties:
                  activeProvisionAttempt:
                    description: ActiveProvisionAttempt is the ID of the in-progress
                      attempt, if any.
                    type: string
                  provisionAttempts:
                    description: ProvisionAttempts is recent deploy/provision history
                      (newest first, capped in controller).
                    items:
                      description: GeassProvisionAttempt tracks one deploy/provision
                        run for a resource.
                      properties:
                        buildRef:
                          description: BuildRef links to a GeassBuild for image build
                            logs (services with Git source).
                          type: string
                        completedAt:
                          description: CompletedAt is set when the attempt reaches
                            a terminal phase.
                          format: date-time
                          type: string
                        deploymentRef:
                          description: DeploymentRef links to a GeassDeployment row
                            for this deploy (services).
                          type: string
                        errors:
                          description: Errors lists distinct errors seen during this
                            attempt (newest last).
                          items:
                            description: GeassProvisionAttemptError is one user-safe
                              error recorded during a provision attempt.
                            properties:
                              message:
                                description: Message is product-facing text (no operator
                                  internals).
                                maxLength: 500
                                type: string
                              recordedAt:
                                description: RecordedAt is when this error was observed.
                                format: date-time
                                type: string
                            required:
                            - message
                            - recordedAt
                            type: object
                          maxItems: 12
                          type: array
                        id:
                          description: ID uniquely identifies this attempt within
                            the resource.
                          maxLength: 64
                          type: string
                        phase:
                          description: Phase is Running until the attempt succeeds
                            or fails.
                          enum:
                          - Running
                          - Succeeded
                          - Failed
                          type: string
                        startedAt:
                          description: StartedAt is when provisioning began.
                          format: date-time
                          type: string
                        summary:
                          description: Summary is a short user-facing outcome line
                            when the attempt completes.
                          type: string
                      required:
                      - id
                      - phase
                      - startedAt
                      type: object
                    maxItems: 8
                    type: array
                type: object
              reconcileRetry:
                description: ReconcileRetry tracks provision retries before reconciliation
                  gives up.
                properties:
                  reconcileFailureGeneration:
                    description: ReconcileFailureGeneration is spec generation when
                      provisioning was marked failed.
                    format: int64
                    type: integer
                  reconcileFailureStarted:
                    description: ReconcileFailureStarted is set when ReconcileFailures
                      first increments.
                    format: date-time
                    type: string
                  reconcileFailures:
                    description: ReconcileFailures counts consecutive infrastructure
                      errors while not ready.
                    format: int32
                    type: integer
                type: object
              targetNamespace:
                description: TargetNamespace is the namespace workloads were created
                  in.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
