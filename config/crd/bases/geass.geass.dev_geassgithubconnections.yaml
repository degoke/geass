---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassgithubconnections.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassGitHubConnection
    listKind: GeassGitHubConnectionList
    plural: geassgithubconnections
    singular: geassgithubconnection
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GeassGitHubConnection stores only references to authentication material. The
              token and webhook secret remain in Kubernetes Secrets and are never exposed
              through application resources or status.
            properties:
              external:
                description: |-
                  External makes this the connection of a GitHub App that is not the cluster's own: a provider outside the
                  cluster (such as rungeass) owns the App and its private key, sends GitHub's events on to Geass signed with the
                  secret in webhookSecretRef, and gives Geass an installation token for each installation listed here. Geass never
                  mints a token for these installations and never holds the App's private key. Set through the API, not by hand.
                properties:
                  appSlug:
                    description: |-
                      AppSlug is the App's name in its address on GitHub (github.com/apps/<appSlug>). Geass uses it to find the comments
                      it wrote as the App and to link to the App's settings.
                    maxLength: 100
                    pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$
                    type: string
                  installURL:
                    description: |-
                      InstallURL is where a person installs the App on a GitHub account. Connecting a project that has no installation
                      to use sends the person there.
                    maxLength: 2048
                    pattern: ^https://
                    type: string
                  installations:
                    description: Installations are the installations of the App that
                      belong to this cluster.
                    items:
                      description: |-
                        GeassGitHubInstallation is one installation of an external GitHub App: the GitHub account it is on, and the
                        organization whose projects may build from it.
                      properties:
                        account:
                          description: Account is the login of the GitHub user or
                            organization the App is installed on.
                          maxLength: 100
                          minLength: 1
                          type: string
                        accountType:
                          description: AccountType is User or Organization, as GitHub
                            says.
                          maxLength: 32
                          type: string
                        id:
                          description: ID is GitHub's id of the installation.
                          format: int64
                          minimum: 1
                          type: integer
                        org:
                          description: |-
                            Org is the GeassOrganization whose projects may connect to this installation. Empty is the platform's own: only
                            projects that belong to no organization may.
                          maxLength: 63
                          type: string
                      required:
                      - account
                      - id
                      type: object
                    maxItems: 1000
                    type: array
                    x-kubernetes-list-map-keys:
                    - id
                    x-kubernetes-list-type: map
                  provider:
                    description: Provider names who runs the App. The dashboard shows
                      it ("GitHub is provided by rungeass").
                    maxLength: 63
                    minLength: 1
                    type: string
                required:
                - provider
                type: object
              secretRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              webhookSecretRef:
                description: |-
                  LocalObjectReference contains enough information to let you locate the
                  referenced object inside the same namespace.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
            required:
            - secretRef
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              installations:
                description: |-
                  Installations is, for an external App, what Geass holds for each of its installations: whether it has a token
                  for it and when that token stops working. The token itself is only ever in a Secret. One entry per installation of
                  spec.external, so it has the same bound.
                items:
                  description: GeassGitHubInstallationStatus is the state of the token
                    Geass holds for one installation of an external App.
                  properties:
                    id:
                      format: int64
                      type: integer
                    tokenExpiresAt:
                      description: TokenExpiresAt is when the token the provider gave
                        last stops working. Unset while there is none.
                      format: date-time
                      type: string
                    tokenState:
                      description: TokenState is Valid, ExpiringSoon (valid, and due
                        to be renewed), Expired or Missing.
                      type: string
                  required:
                  - id
                  - tokenState
                  type: object
                maxItems: 1000
                type: array
              ready:
                type: boolean
            required:
            - ready
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
