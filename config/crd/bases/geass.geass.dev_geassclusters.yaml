---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassclusters.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassCluster
    listKind: GeassClusterList
    plural: geassclusters
    singular: geasscluster
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.release
      name: Release
      type: string
    - jsonPath: .status.k3s.controlPlaneVersion
      name: K3s
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GeassCluster is the Schema for the geassclusters API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GeassClusterSpec defines the desired state of GeassCluster.
            properties:
              addons:
                description: Addons controls default platform add-ons reconciled by
                  the cluster controller.
                properties:
                  certManager:
                    description: CertManager controls cert-manager installation.
                    properties:
                      acmeEmail:
                        description: |-
                          ACMEEmail is the contact address Let's Encrypt knows the cluster's ACME account by, and where it
                          sends expiry notices. When it is set, Geass keeps the letsencrypt-prod ClusterIssuer that every
                          ingress asks for in place; when it is empty, no issuer is created and no HTTPS certificate can be
                          issued, which the ClusterIssuerReady condition reports. The installer sets it from GEASS_ACME_EMAIL.
                          Let's Encrypt refuses placeholder domains such as example.com.
                        maxLength: 254
                        pattern: ^([^@\s]+@[^@\s]+\.[^@\s]+)?$
                        type: string
                      enabled:
                        default: true
                        description: Enabled installs cert-manager when true.
                        type: boolean
                    type: object
                  logging:
                    description: Logging controls log collection and search.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Enabled installs log collection. It is opt-in: it adds a pod per node and a server with a volume, which a
                          small cluster may not want, and it is not installed unless asked for. The installer turns it on.
                        type: boolean
                      retentionDays:
                        default: 7
                        description: RetentionDays is how long logs are kept before
                          they are deleted.
                        format: int32
                        maximum: 90
                        minimum: 1
                        type: integer
                    type: object
                  longhorn:
                    description: Longhorn controls the Longhorn storage engine installation.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Enabled installs Longhorn and the Geass-managed storage classes. It defaults to
                          off because Longhorn needs iSCSI on every node, which clusters such as kind do
                          not provide; the installer turns it on for the clusters it builds.
                        type: boolean
                    type: object
                  monitoring:
                    description: Monitoring controls kube-prometheus-stack installation.
                    properties:
                      enabled:
                        default: true
                        description: Enabled installs monitoring when true.
                        type: boolean
                      profile:
                        default: lite
                        description: Profile selects the monitoring footprint.
                        enum:
                        - lite
                        - full
                        type: string
                    type: object
                  serverless:
                    description: Serverless controls scale to zero.
                    properties:
                      enabled:
                        default: false
                        description: |-
                          Enabled installs KEDA and the HTTP add-on. It is opt-in: it adds a few small pods, and changes the
                          ingress controller's settings so it can route to the add-on. Services can then ask to scale to zero.
                          Turning it off never uninstalls KEDA, so services that sleep keep sleeping.
                        type: boolean
                    type: object
                type: object
              defaultRegion:
                description: |-
                  DefaultRegion is where projects that do not choose a region run. Left empty, such projects
                  may run on any node.
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              etcdSnapshots:
                description: |-
                  EtcdSnapshots says where copies of the cluster's own state are kept off the control plane's disk. Left out, there
                  are none: the snapshots K3s takes stay on the disk they protect. It is opt-in.
                properties:
                  bucket:
                    description: Bucket is the S3 bucket the copies are sent to.
                    maxLength: 63
                    minLength: 3
                    pattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$
                    type: string
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret in geass-system with the keys ACCESS_KEY_ID and ACCESS_SECRET_KEY: an access
                      key that can list the bucket and read, write and delete objects in it, and can do nothing else. It is
                      geass-etcd-snapshot-credentials when left empty.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  endpoint:
                    description: |-
                      Endpoint is the host (and port, if it is not the usual one) of an S3-compatible server, such as
                      s3.eu-north-1.amazonaws.com or minio.example.com:9000, without a scheme. Left empty it is AWS S3.
                    maxLength: 253
                    pattern: ^([A-Za-z0-9.-]+(:[0-9]+)?)?$
                    type: string
                  folder:
                    description: Folder is the prefix the copies are stored under
                      in the bucket. It is geass when left empty.
                    maxLength: 200
                    pattern: ^[A-Za-z0-9._/-]*$
                    type: string
                  insecure:
                    description: |-
                      Insecure sends the copies over plain HTTP, for a server on a network that is closed to everyone else. It is never
                      right for AWS.
                    type: boolean
                  region:
                    description: |-
                      Region is the bucket's region. Left empty it is us-east-1, which is what K3s assumes, and is right for any
                      S3-compatible server that has no regions.
                    maxLength: 40
                    pattern: ^[a-z0-9-]*$
                    type: string
                required:
                - bucket
                type: object
              k3s:
                description: K3s says which K3s release the nodes should run.
                properties:
                  version:
                    description: |-
                      Version is the K3s release the worker nodes are brought to, such as v1.36.5+k3s1. When it is set and a
                      worker runs something else, the operator upgrades the workers one at a time: it cordons the node, replaces
                      K3s on it over SSH, waits for it to be ready on the new version and uncordons it, and stops at the first
                      that does not come back. Workers are only moved to the version the control plane already runs, because an
                      agent must not be newer than its server, and the operator never touches the control plane itself: it is
                      upgraded by running the installer on that machine with --k3s-version, which also sets this field.
                      Left empty, the operator leaves K3s on every node alone.
                    maxLength: 40
                    pattern: ^(v1\.[0-9]+\.[0-9]+\+k3s[0-9]+)?$
                    type: string
                type: object
              lostNodeAfter:
                description: |-
                  LostNodeAfter is how long a node may be not ready before it is taken to be lost, and the databases on it are made to start
                  on another node or, for a highly available Postgres database whose volume was on it alone, replaced (which removes that
                  instance's volume). It is 15 minutes when left out. 0s turns it off, which is what to set before a planned shutdown of
                  longer than that.
                type: string
              network:
                description: Network says how the nodes reach each other.
                properties:
                  controlPlaneFirewall:
                    description: |-
                      ControlPlaneFirewall names the cloud firewall in front of the control plane. When it is set, the address of each
                      machine a pool creates is let through it (the API port and, in a WireGuard mesh, the overlay port) before the
                      machine joins, and taken out again when the machine is removed, so the control plane need not be open to the
                      internet. Without it the control plane's TCP 6443 (and UDP 51820 in a WireGuard mesh) must already accept the
                      new machines.
                    properties:
                      connectionRef:
                        description: |-
                          ConnectionRef is the cloud connection (for Compute) at the provider where the control plane runs. It may be
                          another provider than the one that creates the machines.
                        minLength: 1
                        type: string
                      region:
                        description: Region is where the firewall is, for a provider
                          that answers per region.
                        type: string
                      target:
                        description: Target is the provider's id for the firewall
                          or security group, such as sg-0abc123 or a Hetzner firewall
                          id.
                        minLength: 1
                        type: string
                    required:
                    - connectionRef
                    - target
                    type: object
                  mesh:
                    description: |-
                      Mesh says how nodes at different sites, some of them behind a NAT, are joined into one cluster network. Left
                      out, nothing changes: multiSite on its own is the same as a mesh with the WireGuard provider, as it always was,
                      and a cluster that sets neither keeps one private network. Setting it also turns on the checks the operator
                      makes of a mesh (the MeshReady condition, and a worker is refused while the control plane is not on it), and
                      makes multiSite redundant. Like multiSite it is chosen when the cluster is installed, because it describes how
                      the control plane was built and Geass does not rebuild that.
                    properties:
                      provider:
                        default: WireGuard
                        description: |-
                          Provider is what carries traffic between the sites. WireGuard is the default and needs nothing but UDP 51820
                          between nodes; Tailscale needs a tailnet (or a Headscale server) and an auth key, and opens no port.
                        enum:
                        - WireGuard
                        - Tailscale
                        type: string
                      tailscale:
                        description: |-
                          Tailscale holds what a node needs to join the tailnet. It is required with provider Tailscale and refused
                          with any other.
                        properties:
                          authKeySecretRef:
                            description: |-
                              AuthKeySecretRef names a Secret in geass-system that holds the key nodes join the tailnet with, under the key
                              authKey. Use a reusable, pre-approved key that is tagged (or that belongs to a user who may have the nodes),
                              and that expires: it is copied to the disk of every node, where only root can read it. The key is never shown
                              in a status, an event or the operator's log.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9.]*[a-z0-9])?$
                            type: string
                          controlServerURL:
                            description: |-
                              ControlServerURL is the address of a Headscale server (or another Tailscale-compatible control server), such as
                              https://headscale.example.com. Left empty, nodes join Tailscale's own service. It must be https, and has
                              no user name, query or fragment.
                            maxLength: 253
                            pattern: ^(https://[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?)?$
                            type: string
                        required:
                        - authKeySecretRef
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: provider Tailscale needs the tailscale settings (an
                        auth key Secret)
                      rule: self.provider != 'Tailscale' || has(self.tailscale)
                    - message: the tailscale settings are only for provider Tailscale
                      rule: self.provider == 'Tailscale' || !has(self.tailscale)
                  multiSite:
                    description: |-
                      MultiSite means the nodes are at different providers and reach each other over the internet, so
                      the overlay network is encrypted (k3s's WireGuard backend) and every node advertises its public
                      IP. It is chosen when the cluster is installed, because switching means restarting every node,
                      and workers are joined to match it.
                    type: boolean
                type: object
              serverURL:
                description: ServerURL is the URL of the GeassCluster server.
                type: string
              tokenSecretRef:
                description: TokenSecretRef is the reference to the secret containing
                  the token for the GeassCluster.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              version:
                description: Version is the version of the GeassCluster.
                type: string
            required:
            - serverURL
            - tokenSecretRef
            - version
            type: object
          status:
            description: GeassClusterStatus defines the observed state of GeassCluster.
            properties:
              addons:
                description: |-
                  Addons is how each of the add-ons that can be switched on and off is doing: monitoring, logging, serverless and
                  longhorn.
                items:
                  description: |-
                    GeassClusterAddonStatus is how one add-on of spec.addons is doing. The operator writes it, so that a person can see why an
                    add-on is not up without looking at the Helm jobs that install it.
                  properties:
                    installed:
                      description: |-
                        Installed says that something of the add-on is in the cluster. It is true for an add-on that is Off when turning it
                        off does not remove it (scale to zero and replicated storage never are).
                      type: boolean
                    message:
                      description: Message says in a sentence what the add-on is waiting
                        for, or what went wrong.
                      type: string
                    name:
                      description: 'Name is the add-on, as it is named under spec.addons:
                        monitoring, logging, serverless or longhorn.'
                      minLength: 1
                      type: string
                    reason:
                      description: Reason is a short word for why the add-on is Failed,
                        such as InstallFailed or InstallSuspended.
                      type: string
                    state:
                      description: State is Off, Installing, Ready or Failed.
                      enum:
                      - "Off"
                      - Installing
                      - Ready
                      - Failed
                      type: string
                  required:
                  - name
                  - state
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conditions:
                description: conditions represent the current state of the GeassCluster
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              etcdSnapshots:
                description: EtcdSnapshots is what the operator found in the bucket
                  that spec.etcdSnapshots names.
                properties:
                  checkedAt:
                    description: CheckedAt is when the bucket was last looked at.
                    format: date-time
                    type: string
                  copies:
                    description: Copies is how many snapshots the bucket holds under
                      the folder.
                    format: int32
                    type: integer
                  lastCopyName:
                    description: LastCopyName is the name of that snapshot, which
                      is what k3s server --cluster-reset-restore-path is given.
                    type: string
                  lastCopyTime:
                    description: LastCopyTime is when the newest snapshot in the bucket
                      was written.
                    format: date-time
                    type: string
                type: object
              k3s:
                description: K3s is what the cluster's nodes run and how an upgrade
                  of the workers is going.
                properties:
                  controlPlaneVersion:
                    description: ControlPlaneVersion is the oldest K3s version that
                      a control plane node reports.
                    type: string
                  upgrade:
                    description: Upgrade is the progress of an upgrade of the workers
                      to spec.k3s.version.
                    properties:
                      currentNode:
                        description: CurrentNode is the worker being upgraded, while
                          one is.
                        type: string
                      message:
                        description: Message says what the upgrade is doing, or why
                          it is not.
                        type: string
                      phase:
                        description: Phase says how the upgrade is going.
                        type: string
                      startedAt:
                        description: StartedAt is when the current node's upgrade
                          began, which is what its time limit counts from.
                        format: date-time
                        type: string
                      step:
                        description: Step is how far the current node has got.
                        type: string
                      targetVersion:
                        description: TargetVersion is the version the workers are
                          being brought to.
                        type: string
                    type: object
                type: object
              phase:
                description: Phase is the current phase of the GeassCluster.
                type: string
              reconcileRetry:
                description: ReconcileRetry tracks provision retries before reconciliation
                  gives up.
                properties:
                  reconcileFailureGeneration:
                    description: ReconcileFailureGeneration is spec generation when
                      provisioning was marked failed.
                    format: int64
                    type: integer
                  reconcileFailureStarted:
                    description: ReconcileFailureStarted is set when ReconcileFailures
                      first increments.
                    format: date-time
                    type: string
                  reconcileFailures:
                    description: ReconcileFailures counts consecutive infrastructure
                      errors while not ready.
                    format: int32
                    type: integer
                type: object
              release:
                description: |-
                  Release is the Geass release of the operator that last reconciled this cluster, such as v0.2.0. The
                  installer reads it before an update, to refuse a downgrade and to wait until the new operator reports
                  itself. A cluster installed before releases were recorded has none until its operator is updated.
                type: string
              schemaVersion:
                description: |-
                  SchemaVersion is the level of data migrations that have been applied to what this cluster stores.
                  An operator that knows of fewer migrations than this refuses to start, so that an older release can
                  never reconcile data that a newer one has changed.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
