---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassorganizations.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassOrganization
    listKind: GeassOrganizationList
    plural: geassorganizations
    singular: geassorganization
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.displayName
      name: Name
      type: string
    - jsonPath: .spec.idpID
      name: IdP ID
      type: string
    - jsonPath: .spec.suspended
      name: Suspended
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GeassOrganization is the Schema for the geassorganizations API. It is created by a platform administrator, and only
          when the platform's tenancy is turned on does anything look at it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GeassOrganizationSpec says which people of the identity provider's organization are Geass's organization, and what
              it may use. It is the tenant boundary: a project belongs to one organization, and a person who signed in as a member
              of one organization cannot see or change another's.
            properties:
              allowedDomains:
                description: |-
                  AllowedDomains are the domains the organization's services may claim a hostname under: a host is allowed when
                  it is one of them or sits below one. The hostnames Geass itself gives a service are always allowed. Without a
                  list, an organization may claim any hostname nobody else holds.
                items:
                  maxLength: 253
                  pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)+[a-z]{2,63}$
                  type: string
                maxItems: 50
                type: array
                x-kubernetes-list-type: set
              clusterRef:
                description: |-
                  ClusterRef is the cluster the organization's new projects are made in. Without it they use the platform's
                  default cluster. A project that already exists stays where it is.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              displayName:
                description: DisplayName is what the dashboard calls the organization.
                maxLength: 100
                minLength: 1
                type: string
              idp:
                description: |-
                  IdP is an identity provider of the organization's own, which its people sign in through instead of the platform's.
                  A person who signs in through it works in this organization, in all of it, as the role its claim maps to; it can never
                  make anybody an administrator of the platform or put anybody in another organization.
                properties:
                  clientID:
                    description: ClientID is the client the provider knows Geass as.
                    maxLength: 512
                    minLength: 1
                    type: string
                  credentialRef:
                    description: CredentialRef names the Secret in the system namespace
                      whose "clientSecret" key is the client secret.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  displayName:
                    description: DisplayName is what the sign-in page calls the provider.
                    maxLength: 60
                    type: string
                  enabled:
                    description: |-
                      Enabled lets people sign in through it. It is turned on only after a test sign-in of exactly these settings, so that a
                      typo cannot shut the organization out. Changing anything turns it off.
                    type: boolean
                  issuer:
                    description: Issuer is the provider's issuer URL, as its discovery
                      document names it. It must be https.
                    maxLength: 2048
                    minLength: 1
                    type: string
                  requireClaim:
                    additionalProperties:
                      type: string
                    description: RequireClaim limits sign-in to people whose ID token
                      has each of these claims with the value given.
                    maxProperties: 10
                    type: object
                  roleClaim:
                    description: RoleClaim is the claim of the ID token that holds
                      the person's role in the organization, mapped by RoleMap.
                    maxLength: 253
                    minLength: 1
                    type: string
                  roleMap:
                    additionalProperties:
                      type: string
                    description: RoleMap says which Geass role (admin or viewer) each
                      value of RoleClaim is. A value that is not here is not let in.
                    maxProperties: 50
                    type: object
                  scopes:
                    description: Scopes are asked for besides openid. Empty means
                      email and profile.
                    items:
                      type: string
                    maxItems: 20
                    type: array
                required:
                - clientID
                - issuer
                - roleClaim
                - roleMap
                type: object
              idpID:
                description: |-
                  IdPID is the organization's identifier in the identity provider's sign-in token. A person whose token names it
                  is a member of this organization; no two organizations may have the same one.
                maxLength: 253
                minLength: 1
                type: string
              limits:
                description: |-
                  Limits are the organization's own noisy-neighbour limits, in place of the platform's (spec.tenantLimits.defaults on
                  the GeassPlatformConfig): each field set here replaces the platform's for that field. They are held in each of the
                  organization's namespaces, while its quota is the total over all of them.
                properties:
                  bandwidth:
                    description: |-
                      Bandwidth caps the network traffic of each pod. It works only where the cluster's network plugin runs the CNI bandwidth
                      plugin, and only on Kubernetes 1.36 or later, where Geass can add it to every pod as it is made.
                    properties:
                      egress:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Egress is the most a pod may send.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      ingress:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Ingress is the most a pod may receive.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  container:
                    description: Container is what a container that asks for nothing
                      is given, and the most one may ask for.
                    properties:
                      defaultLimit:
                        description: DefaultLimit is the limit a container is given
                          for a resource it sets no limit on. Without it, that is
                          Max.
                        properties:
                          cpu:
                            anyOf:
                            - type: integer
                            - type: string
                            description: CPU, such as "500m" or "2".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          ephemeralStorage:
                            anyOf:
                            - type: integer
                            - type: string
                            description: EphemeralStorage is local disk, such as "1Gi".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          memory:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Memory, such as "512Mi".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        type: object
                      defaultRequest:
                        description: |-
                          DefaultRequest is the request a container is given for a resource it asks for none of. Without it a container that
                          is given a limit asks for 50m CPU, 64Mi memory and 64Mi ephemeral storage, or its limit if that is lower.
                        properties:
                          cpu:
                            anyOf:
                            - type: integer
                            - type: string
                            description: CPU, such as "500m" or "2".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          ephemeralStorage:
                            anyOf:
                            - type: integer
                            - type: string
                            description: EphemeralStorage is local disk, such as "1Gi".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          memory:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Memory, such as "512Mi".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        type: object
                      max:
                        description: |-
                          Max is the most a container may set as its limit. A pod with a container that sets more, or whose request is above
                          it, is refused.
                        properties:
                          cpu:
                            anyOf:
                            - type: integer
                            - type: string
                            description: CPU, such as "500m" or "2".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          ephemeralStorage:
                            anyOf:
                            - type: integer
                            - type: string
                            description: EphemeralStorage is local disk, such as "1Gi".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          memory:
                            anyOf:
                            - type: integer
                            - type: string
                            description: Memory, such as "512Mi".
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        type: object
                    type: object
                  ephemeralStorage:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      EphemeralStorage is the most local disk the pods of each namespace may use together, such as "20Gi": the total of
                      their containers' ephemeral-storage limits, and of their requests. A container's ephemeral storage is what it writes to
                      its own filesystem, its logs and its emptyDir volumes, on the node's disk. It needs a default limit for containers that
                      set none (container.defaultLimit.ephemeralStorage, or container.max.ephemeralStorage), or every such pod is refused.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  pods:
                    description: Pods is the most pods each namespace may have running
                      or waiting at once. Finished pods are not counted.
                    format: int32
                    maximum: 100000
                    minimum: 1
                    type: integer
                type: object
              maxProjects:
                description: |-
                  MaxProjects is how many projects the organization may have. Without it there is no limit; zero keeps it from
                  making any. It is checked when a project is made or given to the organization, so projects that are already
                  there are never removed by lowering it.
                format: int32
                minimum: 0
                type: integer
              quota:
                description: |-
                  Quota caps what all the organization's projects can ask for together, added up over every environment of
                  every project. It is held the way a project's own quota is: through a ResourceQuota in each environment, kept
                  in step with the total, so two environments starting at the same instant can briefly pass it. Nothing that is
                  running is stopped when it is passed. A project's own quota still applies, and an environment is held to the
                  lowest of them.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: CPU is the most CPU the pods of the project may ask
                      for in total, such as "8".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Memory is the most memory the pods of the project
                      may ask for in total, such as "16Gi".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  pods:
                    description: Pods is the most pods the project may have running
                      or waiting at once. Finished pods are not counted.
                    format: int32
                    minimum: 1
                    type: integer
                  storage:
                    anyOf:
                    - type: integer
                    - type: string
                    description: Storage is the most disk the volumes of the project
                      may ask for in total, such as "200Gi".
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              region:
                description: |-
                  Region is where the organization's projects run when they name none of their own: only nodes in the region
                  are used. Without it they use the cluster's default region.
                maxLength: 40
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              registry:
                description: |-
                  Registry is where the organization's builds push their images, and the login they push with, in place of the
                  platform's. It makes the organization's builds run with a credential of its own and not the platform's: the
                  organization's builds run in a namespace of their own, which holds only this login (or, without it, a copy of the
                  platform's). A service that names a registry of its own keeps it.
                properties:
                  credentialRef:
                    description: |-
                      LocalObjectReference contains enough information to let you locate the
                      referenced object inside the same namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  repository:
                    type: string
                type: object
              requiredTags:
                description: |-
                  RequiredTags are node tags every workload of every project of the organization must run on, added to each
                  project's own. Tagging nodes with the same tag keeps the organization's workloads to those nodes, and, with the
                  compliance policy, keeps anything else from being scheduled there.
                items:
                  maxLength: 40
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                maxItems: 8
                type: array
                x-kubernetes-list-type: set
              suspended:
                description: Suspended keeps the organization's people from signing
                  in while its projects keep running.
                type: boolean
              workspaces:
                description: |-
                  Workspaces are the groups of projects inside the organization. A person who is not an administrator of the
                  organization works in one workspace at a time and sees only its projects.
                items:
                  description: |-
                    GeassOrganizationWorkspace is a group of projects inside an organization, such as a team's. Who belongs to it is
                    decided by the identity provider; Geass only holds the name it gives the group in its sign-in token.
                  properties:
                    displayName:
                      description: DisplayName is what the dashboard calls the workspace.
                      maxLength: 100
                      minLength: 1
                      type: string
                    id:
                      description: ID is what projects name in spec.workspace. It
                        is made by Geass and does not change.
                      pattern: ^ws-[a-f0-9]{6}$
                      type: string
                    idpID:
                      description: IdPID is the workspace's identifier in the identity
                        provider's sign-in token (a team id).
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - displayName
                  - id
                  - idpID
                  type: object
                maxItems: 100
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
            required:
            - displayName
            - idpID
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
