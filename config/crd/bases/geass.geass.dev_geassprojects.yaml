---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassprojects.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassProject
    listKind: GeassProjectList
    plural: geassprojects
    singular: geassproject
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              clusterRef:
                description: ClusterRef identifies the GeassCluster that owns this
                  project.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              displayName:
                description: DisplayName is the user-facing project name shown by
                  the dashboard (lowercase slug, e.g. morning-beach).
                type: string
              environments:
                description: Environments are the isolated environments enabled for
                  this project.
                items:
                  maxLength: 63
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  type: string
                minItems: 1
                type: array
              githubConnectionRef:
                description: GitHubConnectionRef references a Secret containing GitHub
                  credentials and webhook data.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              prEnvironments:
                description: PREnvironments creates a temporary copy of an environment
                  for every pull request.
                properties:
                  baseEnvironment:
                    description: BaseEnvironment is copied for every pull request.
                    maxLength: 63
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  enabled:
                    description: Enabled turns pull request environments on.
                    type: boolean
                  maxOpen:
                    default: 5
                    description: MaxOpen limits how many pull request environments
                      can exist at once.
                    format: int32
                    maximum: 25
                    minimum: 1
                    type: integer
                required:
                - enabled
                type: object
              sharedVariables:
                description: SharedVariables are environment-scoped values available
                  to project services.
                items:
                  description: |-
                    GeassSharedVariable is a project-scoped value materialized into each selected
                    environment. Secret values are written to a Kubernetes Secret and are never
                    copied into application status.
                  properties:
                    environment:
                      description: Environment scopes the variable to one project
                        environment.
                      maxLength: 63
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    name:
                      description: Name is the environment variable name.
                      pattern: ^[A-Z_][A-Z0-9_]*$
                      type: string
                    secretRef:
                      description: SecretRef points to a Kubernetes Secret containing
                        the value when it is sensitive.
                      properties:
                        key:
                          description: The key of the secret to select from.  Must
                            be a valid secret key.
                          type: string
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                        optional:
                          description: Specify whether the Secret or its key must
                            be defined
                          type: boolean
                      required:
                      - key
                      type: object
                      x-kubernetes-map-type: atomic
                    value:
                      description: Value is the non-secret value to materialize.
                      type: string
                  required:
                  - environment
                  - name
                  type: object
                type: array
              webhooks:
                description: |-
                  Webhooks receive signed notifications about deployments in this project. The signing secret of
                  each webhook is kept in the Secret <project>-webhooks, never in this spec.
                items:
                  description: GeassWebhook is an outbound webhook for project events.
                  properties:
                    disabled:
                      description: Disabled pauses deliveries without deleting the
                        webhook.
                      type: boolean
                    events:
                      description: Events limits which events are sent. Empty means
                        every event.
                      items:
                        enum:
                        - deployment.started
                        - deployment.succeeded
                        - deployment.failed
                        type: string
                      type: array
                    id:
                      description: ID identifies the webhook in the dashboard and
                        in delivery records.
                      pattern: ^[a-z0-9]{8}$
                      type: string
                    url:
                      description: URL receives a POST for each event.
                      maxLength: 2048
                      minLength: 8
                      type: string
                  required:
                  - id
                  - url
                  type: object
                maxItems: 20
                type: array
            required:
            - clusterRef
            - environments
            type: object
          status:
            properties:
              clusterRef:
                description: ClusterRef is the cluster observed by the controller.
                  It prevents silent project migration.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              environments:
                items:
                  properties:
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - name
                  - namespace
                  type: object
                type: array
              pullRequests:
                description: PullRequests are the open pull request environments.
                items:
                  description: GeassPullRequestEnvironment records an environment
                    created for a pull request.
                  properties:
                    branch:
                      type: string
                    environment:
                      type: string
                    number:
                      format: int32
                      type: integer
                    openedAt:
                      format: date-time
                      type: string
                    repository:
                      type: string
                    url:
                      type: string
                  required:
                  - branch
                  - environment
                  - number
                  - openedAt
                  - repository
                  type: object
                maxItems: 50
                type: array
              reconcileRetry:
                description: ReconcileRetry tracks provision retries before reconciliation
                  gives up.
                properties:
                  reconcileFailureGeneration:
                    description: ReconcileFailureGeneration is spec generation when
                      provisioning was marked failed.
                    format: int64
                    type: integer
                  reconcileFailureStarted:
                    description: ReconcileFailureStarted is set when ReconcileFailures
                      first increments.
                    format: date-time
                    type: string
                  reconcileFailures:
                    description: ReconcileFailures counts consecutive infrastructure
                      errors while not ready.
                    format: int32
                    type: integer
                type: object
              webhookDeliveries:
                description: WebhookDeliveries are the most recent webhook deliveries,
                  newest first.
                items:
                  description: GeassWebhookDelivery records the outcome of one webhook
                    delivery.
                  properties:
                    attempts:
                      format: int32
                      type: integer
                    deliveryId:
                      type: string
                    durationMillis:
                      format: int64
                      type: integer
                    error:
                      type: string
                    event:
                      type: string
                    statusCode:
                      format: int32
                      type: integer
                    time:
                      format: date-time
                      type: string
                    webhookId:
                      type: string
                  required:
                  - attempts
                  - deliveryId
                  - durationMillis
                  - event
                  - time
                  - webhookId
                  type: object
                maxItems: 20
                type: array
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
