---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassplatformconfigs.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassPlatformConfig
    listKind: GeassPlatformConfigList
    plural: geassplatformconfigs
    singular: geassplatformconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              alerting:
                description: |-
                  Alerting says where Geass tells people that something went wrong: a build or deploy that failed, a service
                  that is down, backups that are failing, a node that is not ready.
                properties:
                  channels:
                    description: |-
                      Channels are the places alerts are sent to. The URL of a Slack channel is a secret: it is kept in the
                      Secret geass-alert-channels under the channel's id, never in this spec.
                    items:
                      description: GeassAlertChannel is one place alerts are sent
                        to, and which alerts it hears about.
                      properties:
                        disabled:
                          description: Disabled pauses the channel without deleting
                            it.
                          type: boolean
                        environments:
                          description: Environments limits the channel to these environments,
                            such as production. Empty means every environment.
                          items:
                            type: string
                          maxItems: 100
                          type: array
                        events:
                          description: Events limits which kinds of alert the channel
                            hears about. Empty means every kind, including ones added
                            later.
                          items:
                            enum:
                            - build.failed
                            - deploy.failed
                            - service.down
                            - backup.failed
                            - node.unhealthy
                            - cluster.issue
                            - workload.crashlooping
                            - storage.filling
                            - abuse.suspected
                            type: string
                          type: array
                        id:
                          description: ID identifies the channel in the dashboard
                            and names its secret.
                          pattern: ^[a-z0-9]{8}$
                          type: string
                        name:
                          description: Name is what the dashboard calls the channel.
                          maxLength: 60
                          minLength: 1
                          type: string
                        notifyResolved:
                          default: true
                          description: NotifyResolved sends a message when a problem
                            clears, not only when it starts. Unset means it does.
                          type: boolean
                        org:
                          description: |-
                            Org makes the channel an organization's: the GeassOrganization whose people set it up and can see it. It hears
                            only about that organization's projects (the ones in Projects, when it names some), never about the cluster, and
                            never about another organization's. Without it the channel is the platform's.
                          pattern: ^org-[a-f0-9]{8}$
                          type: string
                        projects:
                          description: |-
                            Projects limits the channel to these projects. Empty means every project, and it is also what lets a
                            channel hear about the cluster itself (nodes, certificates, upgrades), which belongs to no project.
                          items:
                            type: string
                          maxItems: 100
                          type: array
                        recipients:
                          description: Recipients are the addresses an email channel
                            writes to.
                          items:
                            maxLength: 320
                            type: string
                          maxItems: 20
                          type: array
                        type:
                          description: Type is slack, for a Slack incoming webhook
                            (or any receiver that takes the same JSON), or email.
                          enum:
                          - slack
                          - email
                          type: string
                      required:
                      - id
                      - name
                      - type
                      type: object
                    maxItems: 200
                    type: array
                  smtp:
                    description: SMTP is the mail server that email channels send
                      through. Without it email channels cannot send.
                    properties:
                      credentialRef:
                        description: CredentialRef names the Secret in the system
                          namespace whose "password" key is the password.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      from:
                        description: 'From is the address the mail comes from: alerts@example.com,
                          or "Geass <alerts@example.com>".'
                        maxLength: 320
                        minLength: 3
                        type: string
                      host:
                        description: Host is the name of the mail server, such as
                          smtp.example.com.
                        maxLength: 253
                        minLength: 1
                        type: string
                      port:
                        default: 587
                        description: Port is the port the mail server listens on.
                          Unset means 587, which is where STARTTLS is offered.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      security:
                        default: starttls
                        description: |-
                          Security is how the connection is protected: starttls upgrades a plain connection (usually port 587), tls
                          is encrypted from the first byte (usually port 465), and none sends in the clear, which is for a mail
                          server inside the cluster. Unset means starttls.
                        enum:
                        - starttls
                        - tls
                        - none
                        type: string
                      username:
                        description: Username signs in to the mail server. Leave it
                          empty for one that does not ask.
                        maxLength: 256
                        type: string
                    required:
                    - from
                    - host
                    type: object
                type: object
              auth:
                description: |-
                  Auth says how people sign in to the dashboard: with the users in the Secret geass-dashboard-auth (the
                  default), or through an identity provider.
                properties:
                  mode:
                    default: local
                    description: |-
                      Mode is local, where the users are the ones in the Secret geass-dashboard-auth, or external, where an
                      identity provider that speaks OpenID Connect decides who may sign in and with which role. Unset means
                      local. A user of the Secret who has a password and the admin role can still sign in while the mode is
                      external, so that a provider that is down or set up wrong does not lock everyone out.
                    enum:
                    - local
                    - external
                    type: string
                  oidc:
                    description: |-
                      OIDC is the identity provider. It is used only while Mode is external, but it can be filled in and tested
                      before that.
                    properties:
                      accessTokens:
                        description: |-
                          AccessTokens lets a program, or a dashboard embedded in another application, call the API with an access token the
                          provider issued to a person, as `Authorization: Bearer <token>`. The person acts as they would signing in. Unset means
                          off.
                        properties:
                          audience:
                            description: |-
                              Audience is the value the token's aud claim has to contain, and so what says the token was issued for this cluster and
                              not another one of the same provider. Empty means the client ID. A provider that issues access tokens for an API
                              (Better Auth does, for a resource) is given the identifier of that resource here.
                            maxLength: 512
                            type: string
                          enabled:
                            description: |-
                              Enabled turns it on. It has an effect only while people sign in through the provider (mode external). The token has to
                              be a signed JWT access token (RFC 9068, header typ "at+jwt") from the issuer, whose audience names this cluster (see
                              Audience), and whose claims map to a role the way an ID token's do: RoleClaim, RoleMap and RequireClaim, and the
                              organizations claim when organizations are on.
                            type: boolean
                        type: object
                      clientID:
                        description: ClientID is the id Geass was registered with
                          at the provider.
                        maxLength: 512
                        type: string
                      credentialRef:
                        description: |-
                          CredentialRef names the Secret in the system namespace whose "clientSecret" key is the client secret.
                          Leave it empty for a public client that relies on PKCE alone.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      displayName:
                        description: DisplayName is what the sign-in button calls
                          the provider ("Sign in with Acme").
                        maxLength: 60
                        type: string
                      issuer:
                        description: |-
                          Issuer is the provider's issuer URL, exactly as its discovery document names it. It must be https, and
                          cannot be this machine or a link-local address.
                        maxLength: 2048
                        type: string
                      refreshMinutes:
                        description: |-
                          RefreshMinutes makes Geass ask the provider again, this often, whether each person who signed in is still its own and
                          what it now says of them, so that a role that changed, an organization they were taken out of, or a person who was
                          removed is noticed within minutes and not when their session ends. It needs a provider that gives refresh tokens
                          (Geass asks for the offline_access scope). A change ends the person's sessions, and they sign in again to get what is
                          now true. Zero, the default, is off.
                        format: int32
                        maximum: 1440
                        minimum: 0
                        type: integer
                      requireClaim:
                        additionalProperties:
                          type: string
                        description: |-
                          RequireClaim limits sign-in to people whose ID token has each of these claims with the value given, for
                          example {"organization_id": "org_123"} to let only the members of one organization in.
                        maxProperties: 10
                        type: object
                      revokeTokensOnLogout:
                        default: true
                        description: |-
                          RevokeTokensOnLogout is whether a back-channel logout from the provider (someone signed out there, or was removed)
                          also revokes the API tokens and deploy hooks that person made. It always ends their sessions here. Unset means true,
                          which is the safe choice for offboarding: a provider cannot say whether someone signed out or was removed. Turn it off
                          when tokens that CI depends on are made from the accounts of people who sign out; their tokens then last until they
                          expire or are revoked by hand.
                        type: boolean
                      roleClaim:
                        description: |-
                          RoleClaim is the claim of the ID token that holds a person's role at the provider: a name, or a dotted
                          path into nested claims. Its value may be a string, a list, or a comma-separated string.
                        maxLength: 253
                        type: string
                      roleMap:
                        additionalProperties:
                          type: string
                        description: |-
                          RoleMap says which Geass role (admin or viewer) each role at the provider is. A person whose roles map to
                          none cannot sign in.
                        maxProperties: 50
                        type: object
                      scopes:
                        description: Scopes are asked for besides openid. Empty means
                          email and profile.
                        items:
                          type: string
                        maxItems: 20
                        type: array
                      sessionMinutes:
                        default: 60
                        description: |-
                          SessionMinutes is how long a sign-in lasts before the person is sent back to the provider, which is how a
                          role that changed or a person who was removed there is noticed here.
                        format: int32
                        maximum: 720
                        minimum: 5
                        type: integer
                      staleGraceMinutes:
                        description: |-
                          StaleGraceMinutes is how long the provider can be unreachable before the sessions that could not be checked are ended,
                          when RefreshMinutes is on. Unset means 120. Until then a session whose check failed because the provider was down is
                          kept, since it says nothing about the person.
                        format: int32
                        maximum: 1440
                        minimum: 0
                        type: integer
                    type: object
                  tenancy:
                    description: |-
                      Tenancy makes the people who sign in through the provider belong to organizations, each seeing only its own
                      projects. It works only while Mode is external, because the provider is what says who is in which organization.
                    properties:
                      autoProvision:
                        description: |-
                          AutoProvision makes an organization of the provider that Geass does not know yet when one of its administrators
                          signs in, instead of refusing them. Without it only the organizations a platform administrator set up can be
                          signed in to.
                        properties:
                          allow:
                            description: |-
                              Allow limits which organizations may be made, by the provider's id for them: an id as it is, or the start of
                              one followed by "*". Pending without it makes any that asks; Open needs it.
                            items:
                              maxLength: 253
                              type: string
                            maxItems: 50
                            type: array
                          max:
                            description: |-
                              Max is how many organizations can be made this way in all. Unset means 20. It is what keeps a flood of sign-ins
                              from filling the cluster with organizations.
                            format: int32
                            maximum: 500
                            minimum: 1
                            type: integer
                          mode:
                            description: |-
                              Mode is Pending, which makes the organization suspended until a platform administrator approves it (the person is
                              told it is waiting), or Open, which makes it ready to use at once. Open needs Allow, so that it is never for every
                              organization the provider has.
                            enum:
                            - Pending
                            - Open
                            type: string
                        required:
                        - mode
                        type: object
                      enabled:
                        description: |-
                          Enabled turns organizations on. While it is off, everyone who may sign in sees everything, as before. A
                          project that is not assigned to an organization is then seen by the platform's administrators only.
                        type: boolean
                      orgsClaim:
                        description: |-
                          OrgsClaim is the claim of the ID token that lists the organizations a person is in: a name, or a dotted path
                          into nested objects. It holds a list of objects, each with the organization's "id", the person's "role" in it
                          (mapped to a Geass role by the provider's roleMap), and optionally the "workspaces" they are in, each with an "id"
                          and optionally a "role".
                        maxLength: 253
                        type: string
                      platformClaim:
                        description: |-
                          PlatformClaim is the claim of the ID token that makes someone an administrator of the whole platform (its
                          nodes, add-ons, domain and organizations) when it holds any of PlatformValues. Without it only the password
                          administrators are, and no one who signs in through the provider.
                        maxLength: 253
                        type: string
                      platformValues:
                        description: PlatformValues are the values of PlatformClaim
                          that make someone a platform administrator.
                        items:
                          type: string
                        maxItems: 20
                        type: array
                    type: object
                type: object
              cloudflareConnectionRef:
                description: CloudflareConnectionRef references a Secret with Cloudflare
                  API credentials (apiToken, accountId).
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              cloudflareZoneID:
                description: CloudflareZoneID is the DNS zone used for automatic records
                  when Cloudflare is connected.
                type: string
              dashboardExposure:
                default: ingress
                description: DashboardExposure selects how the dashboard is published
                  (ingress on a server or Cloudflare Tunnel for local dev).
                enum:
                - ingress
                - cloudflare-tunnel
                type: string
              dashboardURL:
                description: |-
                  DashboardURL is the public HTTPS URL where the Geass dashboard is reachable.
                  It is used for GitHub App callback and webhook URLs.
                pattern: ^https://[a-zA-Z0-9.-]+(?::[0-9]+)?$
                type: string
              defaultClusterRef:
                description: DefaultClusterRef identifies the cluster new projects
                  should use.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              defaultDomain:
                type: string
              githubAppRef:
                description: GitHubAppRef references a Secret containing the platform
                  GitHub App credentials.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              managed:
                description: |-
                  Managed says a platform runs this Geass and keeps the installer, updates, the K3s release, sign-in and the
                  dashboard's domain for itself: the dashboard's API refuses writes to them and the dashboard shows them read-only.
                  Unset means off, and everything can be changed as before.
                properties:
                  enabled:
                    description: Enabled turns managed mode on. Unset or false means
                      off.
                    type: boolean
                  provider:
                    description: |-
                      Provider names the platform that manages the cluster, such as rungeass. It is put in the messages that say who
                      manages a setting: "managed by rungeass". Left empty the messages say "the platform that runs this cluster".
                    maxLength: 60
                    pattern: ^([A-Za-z0-9][A-Za-z0-9 ._-]*)?$
                    type: string
                type: object
              observability:
                description: |-
                  Observability says where the cluster's metrics and logs go besides the stores in the cluster, and where the
                  dashboard reads them from. Unset, both stay in the cluster.
                properties:
                  external:
                    description: |-
                      External sends the cluster's metrics and logs to stores outside the cluster as well, and has the dashboard read
                      them from there. It is what lets a dashboard that runs outside the cluster (--controllers=false) show metrics and
                      log history. Unset, everything stays in the cluster, as before.
                    properties:
                      logs:
                        description: |-
                          Logs is a store that speaks VictoriaLogs' JSON lines and LogsQL APIs: VictoriaLogs itself, or something in front
                          of it.
                        properties:
                          accountID:
                            description: |-
                              AccountID and ProjectID are the VictoriaLogs tenant the lines are written to and read from, sent as the AccountID
                              and ProjectID headers with every line and every query. Unset means 0, VictoriaLogs' default tenant.
                            format: int64
                            maximum: 4294967295
                            minimum: 0
                            type: integer
                          credentialRef:
                            description: |-
                              CredentialRef names a Secret in the system namespace that holds how to sign in to the store: a "token" key for a
                              bearer token, or "username" and "password" keys for basic authentication. Empty sends no credentials. Geass
                              copies the keys it uses into a Secret beside the log shipper, which reads them from there.
                            properties:
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          projectID:
                            description: ProjectID is the second half of the tenant.
                              See AccountID.
                            format: int64
                            maximum: 4294967295
                            minimum: 0
                            type: integer
                          pushURL:
                            description: |-
                              PushURL is the address of the store that the log shipper sends every line to, besides the store in the cluster:
                              /insert/jsonline is added to it. Lines of projects that require node tags are not sent, as they are not sent to the
                              store in the cluster. Empty sends nothing. It needs the logging add-on.
                            maxLength: 2048
                            pattern: ^https?://[^\s]+$
                            type: string
                          queryURL:
                            description: |-
                              QueryURL is the address of the store that answers LogsQL: /select/logsql/query is added to it. When it is set,
                              the dashboard reads log history from it and never from the store in the cluster. Empty leaves the dashboard
                              reading the cluster's store.
                            maxLength: 2048
                            pattern: ^https?://[^\s]+$
                            type: string
                          retentionDays:
                            description: |-
                              RetentionDays is how long the store keeps logs, which the dashboard reports with the history it reads from it.
                              Unset means the logging add-on's retention.
                            format: int32
                            maximum: 3650
                            minimum: 1
                            type: integer
                        type: object
                      metrics:
                        description: |-
                          Metrics is a store that speaks Prometheus remote write and the Prometheus query API, such as Mimir, Cortex,
                          Thanos or VictoriaMetrics.
                        properties:
                          credentialRef:
                            description: |-
                              CredentialRef names a Secret in the system namespace that holds how to sign in to the store: a "token" key for a
                              bearer token, or "username" and "password" keys for basic authentication. Empty sends no credentials. Geass
                              copies the keys it uses into a Secret beside Prometheus, which reads them from there.
                            properties:
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          queryURL:
                            description: |-
                              QueryURL is a Prometheus-compatible query API: the address that /api/v1/query and /api/v1/query_range are added to
                              (for Mimir that is its /prometheus prefix). When it is set, the dashboard reads every metric it shows from it and
                              never from the Prometheus in the cluster. Empty leaves the dashboard reading the cluster's Prometheus.
                            maxLength: 2048
                            pattern: ^https?://[^\s]+$
                            type: string
                          remoteWriteURL:
                            description: |-
                              RemoteWriteURL receives every sample the cluster's Prometheus keeps, by Prometheus remote write: Mimir's or
                              Cortex's /api/v1/push, VictoriaMetrics' /api/v1/write (with the tenant in the path for its cluster version), or
                              anything else that speaks the protocol. Prometheus keeps its own copy as before. Empty sends nothing. It needs the
                              monitoring add-on.
                            maxLength: 2048
                            pattern: ^https?://[^\s]+$
                            type: string
                          tenant:
                            description: |-
                              Tenant is sent in TenantHeader with every write and every query, for a store that keeps tenants apart by a
                              header. Empty sends no tenant header, for a store that takes the tenant from the URL or from the credentials.
                            maxLength: 150
                            pattern: ^[A-Za-z0-9!._*'()-]+$
                            type: string
                          tenantHeader:
                            description: |-
                              TenantHeader is the header that carries Tenant. Unset means X-Scope-OrgID, which Mimir, Cortex and Loki read;
                              Thanos reads THANOS-TENANT. A header Prometheus sets itself, such as Authorization, cannot be used.
                            maxLength: 64
                            pattern: ^[A-Za-z0-9-]+$
                            type: string
                        type: object
                    type: object
                type: object
              prometheusURL:
                type: string
              registry:
                properties:
                  credentialRef:
                    description: |-
                      LocalObjectReference contains enough information to let you locate the
                      referenced object inside the same namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  repository:
                    type: string
                type: object
              rootDomain:
                description: |-
                  RootDomain is the operator's apex domain (e.g. example.com). Geass serves the
                  dashboard at geass.<rootDomain> after DNS verification.
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
                type: string
              tenancy:
                description: |-
                  Tenancy hardens a cluster that organizations who do not trust each other share: how their code runs on the nodes (a
                  sandboxed runtime), what their pods may reach outside the cluster, and keeping the platform's registry login from
                  their builds. Unset means nothing changes.
                properties:
                  abuse:
                    description: |-
                      Abuse looks for the services of organizations' projects that may be abusing the platform's machines, such as by
                      mining: a service whose CPU use stays near what it is allowed, and reports from a detector outside Geass. It says so
                      and, if asked, scales a suspect to zero. What it finds is a signal, not proof. Unset means Geass looks for nothing.
                    properties:
                      action:
                        description: 'Action is what is done to a suspect: None, the
                          default, or Suspend. An organization''s own spec.abuse.action
                          replaces it.'
                        enum:
                        - None
                        - Suspend
                        type: string
                      cpu:
                        description: 'CPU is the sustained-CPU signal. Unset means
                          its defaults: 90 percent of what the copies are allowed,
                          for 30 minutes.'
                        properties:
                          quietTraffic:
                            description: |-
                              QuietTraffic, when set, counts the CPU use only while the service is sent few requests: a busy web service is
                              expected to use its CPU, and a miner is sent nothing. The requests are those the ingress (Traefik) counts, which
                              Prometheus has only while the monitoring add-on is on. Without them a busy service cannot be told from a quiet one,
                              so the stricter withoutTrafficData applies in place of the threshold and window.
                            properties:
                              maxRequestsPerMinute:
                                description: |-
                                  MaxRequestsPerMinute is the most requests a minute, averaged over the last five minutes, that the ingress may pass to
                                  the service while its CPU use counts. Zero means none at all. Requests that reach the service from inside the
                                  cluster, not through the ingress, are not seen.
                                format: int32
                                maximum: 1000000
                                minimum: 0
                                type: integer
                              withoutTrafficData:
                                description: |-
                                  WithoutTrafficData is the threshold and window that apply when the requests cannot be read. Unset means 95 percent
                                  for twice the window.
                                properties:
                                  thresholdPercent:
                                    description: ThresholdPercent replaces the signal's.
