---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassplatformconfigs.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassPlatformConfig
    listKind: GeassPlatformConfigList
    plural: geassplatformconfigs
    singular: geassplatformconfig
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              alerting:
                description: |-
                  Alerting says where Geass tells people that something went wrong: a build or deploy that failed, a service
                  that is down, backups that are failing, a node that is not ready.
                properties:
                  channels:
                    description: |-
                      Channels are the places alerts are sent to. The URL of a Slack channel is a secret: it is kept in the
                      Secret geass-alert-channels under the channel's id, never in this spec.
                    items:
                      description: GeassAlertChannel is one place alerts are sent
                        to, and which alerts it hears about.
                      properties:
                        disabled:
                          description: Disabled pauses the channel without deleting
                            it.
                          type: boolean
                        environments:
                          description: Environments limits the channel to these environments,
                            such as production. Empty means every environment.
                          items:
                            type: string
                          maxItems: 100
                          type: array
                        events:
                          description: Events limits which kinds of alert the channel
                            hears about. Empty means every kind, including ones added
                            later.
                          items:
                            enum:
                            - build.failed
                            - deploy.failed
                            - service.down
                            - backup.failed
                            - node.unhealthy
                            - cluster.issue
                            - workload.crashlooping
                            - storage.filling
                            type: string
                          type: array
                        id:
                          description: ID identifies the channel in the dashboard
                            and names its secret.
                          pattern: ^[a-z0-9]{8}$
                          type: string
                        name:
                          description: Name is what the dashboard calls the channel.
                          maxLength: 60
                          minLength: 1
                          type: string
                        notifyResolved:
                          default: true
                          description: NotifyResolved sends a message when a problem
                            clears, not only when it starts. Unset means it does.
                          type: boolean
                        org:
                          description: |-
                            Org makes the channel an organization's: the GeassOrganization whose people set it up and can see it. It hears
                            only about that organization's projects (the ones in Projects, when it names some), never about the cluster, and
                            never about another organization's. Without it the channel is the platform's.
                          pattern: ^org-[a-f0-9]{8}$
                          type: string
                        projects:
                          description: |-
                            Projects limits the channel to these projects. Empty means every project, and it is also what lets a
                            channel hear about the cluster itself (nodes, certificates, upgrades), which belongs to no project.
                          items:
                            type: string
                          maxItems: 100
                          type: array
                        recipients:
                          description: Recipients are the addresses an email channel
                            writes to.
                          items:
                            maxLength: 320
                            type: string
                          maxItems: 20
                          type: array
                        type:
                          description: Type is slack, for a Slack incoming webhook
                            (or any receiver that takes the same JSON), or email.
                          enum:
                          - slack
                          - email
                          type: string
                      required:
                      - id
                      - name
                      - type
                      type: object
                    maxItems: 200
                    type: array
                  smtp:
                    description: SMTP is the mail server that email channels send
                      through. Without it email channels cannot send.
                    properties:
                      credentialRef:
                        description: CredentialRef names the Secret in the system
                          namespace whose "password" key is the password.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      from:
                        description: 'From is the address the mail comes from: alerts@example.com,
                          or "Geass <alerts@example.com>".'
                        maxLength: 320
                        minLength: 3
                        type: string
                      host:
                        description: Host is the name of the mail server, such as
                          smtp.example.com.
                        maxLength: 253
                        minLength: 1
                        type: string
                      port:
                        default: 587
                        description: Port is the port the mail server listens on.
                          Unset means 587, which is where STARTTLS is offered.
                        format: int32
                        maximum: 65535
                        minimum: 1
                        type: integer
                      security:
                        default: starttls
                        description: |-
                          Security is how the connection is protected: starttls upgrades a plain connection (usually port 587), tls
                          is encrypted from the first byte (usually port 465), and none sends in the clear, which is for a mail
                          server inside the cluster. Unset means starttls.
                        enum:
                        - starttls
                        - tls
                        - none
                        type: string
                      username:
                        description: Username signs in to the mail server. Leave it
                          empty for one that does not ask.
                        maxLength: 256
                        type: string
                    required:
                    - from
                    - host
                    type: object
                type: object
              auth:
                description: |-
                  Auth says how people sign in to the dashboard: with the users in the Secret geass-dashboard-auth (the
                  default), or through an identity provider.
                properties:
                  mode:
                    default: local
                    description: |-
                      Mode is local, where the users are the ones in the Secret geass-dashboard-auth, or external, where an
                      identity provider that speaks OpenID Connect decides who may sign in and with which role. Unset means
                      local. A user of the Secret who has a password and the admin role can still sign in while the mode is
                      external, so that a provider that is down or set up wrong does not lock everyone out.
                    enum:
                    - local
                    - external
                    type: string
                  oidc:
                    description: |-
                      OIDC is the identity provider. It is used only while Mode is external, but it can be filled in and tested
                      before that.
                    properties:
                      clientID:
                        description: ClientID is the id Geass was registered with
                          at the provider.
                        maxLength: 512
                        type: string
                      credentialRef:
                        description: |-
                          CredentialRef names the Secret in the system namespace whose "clientSecret" key is the client secret.
                          Leave it empty for a public client that relies on PKCE alone.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      displayName:
                        description: DisplayName is what the sign-in button calls
                          the provider ("Sign in with Acme").
                        maxLength: 60
                        type: string
                      issuer:
                        description: |-
                          Issuer is the provider's issuer URL, exactly as its discovery document names it. It must be https, and
                          cannot be this machine or a link-local address.
                        maxLength: 2048
                        type: string
                      refreshMinutes:
                        description: |-
                          RefreshMinutes makes Geass ask the provider again, this often, whether each person who signed in is still its own and
                          what it now says of them, so that a role that changed, an organization they were taken out of, or a person who was
                          removed is noticed within minutes and not when their session ends. It needs a provider that gives refresh tokens
                          (Geass asks for the offline_access scope). A change ends the person's sessions, and they sign in again to get what is
                          now true. Zero, the default, is off.
                        format: int32
                        maximum: 1440
                        minimum: 0
                        type: integer
                      requireClaim:
                        additionalProperties:
                          type: string
                        description: |-
                          RequireClaim limits sign-in to people whose ID token has each of these claims with the value given, for
                          example {"organization_id": "org_123"} to let only the members of one organization in.
                        maxProperties: 10
                        type: object
                      revokeTokensOnLogout:
                        default: true
                        description: |-
                          RevokeTokensOnLogout is whether a back-channel logout from the provider (someone signed out there, or was removed)
                          also revokes the API tokens and deploy hooks that person made. It always ends their sessions here. Unset means true,
                          which is the safe choice for offboarding: a provider cannot say whether someone signed out or was removed. Turn it off
                          when tokens that CI depends on are made from the accounts of people who sign out; their tokens then last until they
                          expire or are revoked by hand.
                        type: boolean
                      roleClaim:
                        description: |-
                          RoleClaim is the claim of the ID token that holds a person's role at the provider: a name, or a dotted
                          path into nested claims. Its value may be a string, a list, or a comma-separated string.
                        maxLength: 253
                        type: string
                      roleMap:
                        additionalProperties:
                          type: string
                        description: |-
                          RoleMap says which Geass role (admin or viewer) each role at the provider is. A person whose roles map to
                          none cannot sign in.
                        maxProperties: 50
                        type: object
                      scopes:
                        description: Scopes are asked for besides openid. Empty means
                          email and profile.
                        items:
                          type: string
                        maxItems: 20
                        type: array
                      sessionMinutes:
                        default: 60
                        description: |-
                          SessionMinutes is how long a sign-in lasts before the person is sent back to the provider, which is how a
                          role that changed or a person who was removed there is noticed here.
                        format: int32
                        maximum: 720
                        minimum: 5
                        type: integer
                      staleGraceMinutes:
                        description: |-
                          StaleGraceMinutes is how long the provider can be unreachable before the sessions that could not be checked are ended,
                          when RefreshMinutes is on. Unset means 120. Until then a session whose check failed because the provider was down is
                          kept, since it says nothing about the person.
                        format: int32
                        maximum: 1440
                        minimum: 0
                        type: integer
                    type: object
                  tenancy:
                    description: |-
                      Tenancy makes the people who sign in through the provider belong to organizations, each seeing only its own
                      projects. It works only while Mode is external, because the provider is what says who is in which organization.
                    properties:
                      autoProvision:
                        description: |-
                          AutoProvision makes an organization of the provider that Geass does not know yet when one of its administrators
                          signs in, instead of refusing them. Without it only the organizations a platform administrator set up can be
                          signed in to.
                        properties:
                          allow:
                            description: |-
                              Allow limits which organizations may be made, by the provider's id for them: an id as it is, or the start of
                              one followed by "*". Pending without it makes any that asks; Open needs it.
                            items:
                              maxLength: 253
                              type: string
                            maxItems: 50
                            type: array
                          max:
                            description: |-
                              Max is how many organizations can be made this way in all. Unset means 20. It is what keeps a flood of sign-ins
                              from filling the cluster with organizations.
                            format: int32
                            maximum: 500
                            minimum: 1
                            type: integer
                          mode:
                            description: |-
                              Mode is Pending, which makes the organization suspended until a platform administrator approves it (the person is
                              told it is waiting), or Open, which makes it ready to use at once. Open needs Allow, so that it is never for every
                              organization the provider has.
                            enum:
                            - Pending
                            - Open
                            type: string
                        required:
                        - mode
                        type: object
                      enabled:
                        description: |-
                          Enabled turns organizations on. While it is off, everyone who may sign in sees everything, as before. A
                          project that is not assigned to an organization is then seen by the platform's administrators only.
                        type: boolean
                      orgsClaim:
                        description: |-
                          OrgsClaim is the claim of the ID token that lists the organizations a person is in: a name, or a dotted path
                          into nested objects. It holds a list of objects, each with the organization's "id", the person's "role" in it
                          (mapped to a Geass role by the provider's roleMap), and optionally the "workspaces" they are in, each with an "id"
                          and optionally a "role".
                        maxLength: 253
                        type: string
                      platformClaim:
                        description: |-
                          PlatformClaim is the claim of the ID token that makes someone an administrator of the whole platform (its
                          nodes, add-ons, domain and organizations) when it holds any of PlatformValues. Without it only the password
                          administrators are, and no one who signs in through the provider.
                        maxLength: 253
                        type: string
                      platformValues:
                        description: PlatformValues are the values of PlatformClaim
                          that make someone a platform administrator.
                        items:
                          type: string
                        maxItems: 20
                        type: array
                    type: object
                type: object
              cloudflareConnectionRef:
                description: CloudflareConnectionRef references a Secret with Cloudflare
                  API credentials (apiToken, accountId).
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              cloudflareZoneID:
                description: CloudflareZoneID is the DNS zone used for automatic records
                  when Cloudflare is connected.
                type: string
              dashboardExposure:
                default: ingress
                description: DashboardExposure selects how the dashboard is published
                  (ingress on a server or Cloudflare Tunnel for local dev).
                enum:
                - ingress
                - cloudflare-tunnel
                type: string
              dashboardURL:
                description: |-
                  DashboardURL is the public HTTPS URL where the Geass dashboard is reachable.
                  It is used for GitHub App callback and webhook URLs.
                pattern: ^https://[a-zA-Z0-9.-]+(?::[0-9]+)?$
                type: string
              defaultClusterRef:
                description: DefaultClusterRef identifies the cluster new projects
                  should use.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              defaultDomain:
                type: string
              githubAppRef:
                description: GitHubAppRef references a Secret containing the platform
                  GitHub App credentials.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              prometheusURL:
                type: string
              registry:
                properties:
                  credentialRef:
                    description: |-
                      LocalObjectReference contains enough information to let you locate the
                      referenced object inside the same namespace.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                  repository:
                    type: string
                type: object
              rootDomain:
                description: |-
                  RootDomain is the operator's apex domain (e.g. example.com). Geass serves the
                  dashboard at geass.<rootDomain> after DNS verification.
                pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
                type: string
              traefikAccessLogs:
                properties:
                  enabled:
                    type: boolean
                  format:
                    type: string
                  networkLogEndpoint:
                    type: string
                type: object
              tunnelCNAMETarget:
                description: TunnelCNAMETarget is the Cloudflare tunnel hostname (uuid.cfargotunnel.com)
                  for dashboardExposure=cloudflare-tunnel.
                pattern: ^[a-z0-9-]+(\.[a-z0-9-]+)+$
                type: string
            type: object
          status:
            properties:
              cloudflareTunnelID:
                description: CloudflareTunnelID is the managed Cloudflare tunnel UUID
                  when the connector is enabled.
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
