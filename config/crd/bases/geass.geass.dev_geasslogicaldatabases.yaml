---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geasslogicaldatabases.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassLogicalDatabase
    listKind: GeassLogicalDatabaseList
    plural: geasslogicaldatabases
    singular: geasslogicaldatabase
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              connectionLimit:
                description: |-
                  ConnectionLimit caps how many connections the database's own login may hold on a shared server, so
                  one project cannot use up all of them. It does not apply on a project's own server.
                format: int32
                maximum: 1000
                minimum: 1
                type: integer
              databaseName:
                description: |-
                  DatabaseName is what the database is called in the app's own terms. On a project's own server it is
                  the name of the database there. On the cluster-wide server, which many projects share, it is
                  prefixed with the project and environment so names never collide, and the database gets a login of
                  its own that can reach nothing else.
                type: string
              environment:
                description: GeassEnvironment identifies an opt-in isolated environment
                  within a project.
                maxLength: 63
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              project:
                minLength: 1
                type: string
              serverRef:
                minLength: 1
                type: string
            required:
            - databaseName
            - environment
            - project
            - serverRef
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              connectionSecret:
                type: string
              database:
                description: Database is the database's real name on the server; on
                  a shared server it is not DatabaseName.
                type: string
              jobName:
                type: string
              provision:
                description: Provision tracks deploy attempts and errors for this
                  resource.
                properties:
                  activeProvisionAttempt:
                    description: ActiveProvisionAttempt is the ID of the in-progress
                      attempt, if any.
                    type: string
                  provisionAttempts:
                    description: ProvisionAttempts is recent deploy/provision history
                      (newest first, capped in controller).
                    items:
                      description: GeassProvisionAttempt tracks one deploy/provision
                        run for a resource.
                      properties:
                        buildRef:
                          description: BuildRef links to a GeassBuild for image build
                            logs (services with Git source).
                          type: string
                        completedAt:
                          description: CompletedAt is set when the attempt reaches
                            a terminal phase.
                          format: date-time
                          type: string
                        deploymentRef:
                          description: DeploymentRef links to a GeassDeployment row
                            for this deploy (services).
                          type: string
                        errors:
                          description: Errors lists distinct errors seen during this
                            attempt (newest last).
                          items:
                            description: GeassProvisionAttemptError is one user-safe
                              error recorded during a provision attempt.
                            properties:
                              message:
                                description: Message is product-facing text (no operator
                                  internals).
                                maxLength: 500
                                type: string
                              recordedAt:
                                description: RecordedAt is when this error was observed.
                                format: date-time
                                type: string
                            required:
                            - message
                            - recordedAt
                            type: object
                          maxItems: 12
                          type: array
                        id:
                          description: ID uniquely identifies this attempt within
                            the resource.
                          maxLength: 64
                          type: string
                        phase:
                          description: Phase is Running until the attempt succeeds
                            or fails.
                          enum:
                          - Running
                          - Succeeded
                          - Failed
                          type: string
                        startedAt:
                          description: StartedAt is when provisioning began.
                          format: date-time
                          type: string
                        summary:
                          description: Summary is a short user-facing outcome line
                            when the attempt completes.
                          type: string
                      required:
                      - id
                      - phase
                      - startedAt
                      type: object
                    maxItems: 8
                    type: array
                type: object
              reconcileRetry:
                description: ReconcileRetry tracks provision retries before reconciliation
                  gives up.
                properties:
                  reconcileFailureGeneration:
                    description: ReconcileFailureGeneration is spec generation when
                      provisioning was marked failed.
                    format: int64
                    type: integer
                  reconcileFailureStarted:
                    description: ReconcileFailureStarted is set when ReconcileFailures
                      first increments.
                    format: date-time
                    type: string
                  reconcileFailures:
                    description: ReconcileFailures counts consecutive infrastructure
                      errors while not ready.
                    format: int32
                    type: integer
                type: object
              username:
                description: Username is the login that owns the database on a shared
                  server.
                type: string
            type: object
        required:
        - metadata
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
