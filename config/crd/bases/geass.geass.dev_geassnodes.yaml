---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: geassnodes.geass.geass.dev
spec:
  group: geass.geass.dev
  names:
    kind: GeassNode
    listKind: GeassNodeList
    plural: geassnodes
    singular: geassnode
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GeassNode is the Schema for the geassnodes API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of GeassNode
            properties:
              cloud:
                description: |-
                  Cloud makes Geass create the node's machine at a cloud provider, instead of joining one that already exists.
                  The machine's address is then in status.cloud, and eip, sshUser and sshKeySecretRef are left out: Geass
                  logs in with a key of its own. The connection and the region cannot be changed once the machine exists: the machine
                  is deleted through the connection that made it.
                properties:
                  addressType:
                    description: AddressType says which address of the machine Geass
                      reaches it on. It defaults to Public.
                    enum:
                    - Public
                    - Private
                    type: string
                  connectionRef:
                    description: ConnectionRef names the GeassCloudConnection to create
                      the machine with.
                    minLength: 1
                    type: string
                  image:
                    description: Image is the operating system image. It defaults
                      to the provider's Ubuntu 24.04.
                    type: string
                  region:
                    description: 'Region is the provider''s own place: a location,
                      zone or region.'
                    type: string
                  settings:
                    additionalProperties:
                      type: string
                    description: Settings are values specific to the provider.
                    type: object
                  size:
                    description: Size is the provider's name for a machine size.
                    minLength: 1
                    type: string
                  spot:
                    description: Spot asks for a cheaper machine that the provider
                      may take back.
                    type: boolean
                required:
                - connectionRef
                - size
                type: object
                x-kubernetes-validations:
                - message: 'a node''s cloud connection and region cannot be changed:
                    make a new node'
                  rule: 'self.connectionRef == oldSelf.connectionRef && (has(self.region)
                    ? self.region : '''') == (has(oldSelf.region) ? oldSelf.region
                    : '''')'
              clusterRef:
                description: ClusterRef is the reference to the GeassCluster resource.
                properties:
                  apiVersion:
                    description: API version of the referent.
                    type: string
                  fieldPath:
                    description: |-
                      If referring to a piece of an object instead of an entire object, this string
                      should contain a valid JSON/Go field access statement, such as desiredState.manifest.containers[2].
                      For example, if the object reference is to a container within a pod, this would take on a value like:
                      "spec.containers{name}" (where "name" refers to the name of the container that triggered
                      the event) or if no container name is specified "spec.containers[2]" (container with
                      index 2 in this pod). This syntax is chosen only to have some well-defined way of
                      referencing a part of an object.
                    type: string
                  kind:
                    description: |-
                      Kind of the referent.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
                    type: string
                  name:
                    description: |-
                      Name of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  namespace:
                    description: |-
                      Namespace of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
                    type: string
                  resourceVersion:
                    description: |-
                      Specific resourceVersion to which this reference is made, if any.
                      More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#concurrency-control-and-consistency
                    type: string
                  uid:
                    description: |-
                      UID of the referent.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#uids
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              default:
                description: Default marks a pre-existing cluster control plane node
                  that the operator should not provision.
                type: boolean
              eip:
                description: EIP is the Elastic IP address of the node.
                type: string
              placement:
                description: Placement is the node's region, zone and tags. Leave
                  it out to manage the node's labels by hand.
                properties:
                  region:
                    description: |-
                      Region groups nodes that are close together, such as "us" or "eu". A project pinned to a
                      region only runs on nodes in it.
                    maxLength: 40
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  tags:
                    description: Tags describe what the node is for.
                    items:
                      description: GeassNodeTag is a free-form label on a node, such
                        as "storage" or "gpu".
                      properties:
                        compliance:
                          description: |-
                            Compliance marks the tag as a compliance boundary, such as "hipaa". A compliance tag is always
                            reserved, so nothing but the projects that require it can land on the node.
                          type: boolean
                        name:
                          description: Name is the tag, a lowercase DNS label.
                          maxLength: 40
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        reserved:
                          description: |-
                            Reserved keeps every workload that does not ask for this tag off the node, so the node is
                            dedicated to the work that does.
                          type: boolean
                      required:
                      - name
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  zone:
                    description: |-
                      Zone is the provider or site inside the region, such as "aws-us-east-1". Replicas of a highly
                      available database are spread across zones.
                    maxLength: 40
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                type: object
              pool:
                description: |-
                  Pool is the GeassNodePool the node belongs to. A node of a pool is labelled with it, and the pool is what
                  adds and removes it.
                type: string
                x-kubernetes-validations:
                - message: 'a node cannot move to another pool: make a new node'
                  rule: self == oldSelf
              role:
                description: Role is the role of the node in the cluster.
                enum:
                - ControlPlane
                - Worker
                type: string
              sshKeySecretRef:
                description: |-
                  SSHKeySecretRef is the reference to the secret containing the SSH private key.
                  Required for worker nodes; optional for control plane nodes.
                properties:
                  name:
                    description: name is unique within a namespace to reference a
                      secret resource.
                    type: string
                  namespace:
                    description: namespace defines the space within which the secret
                      name must be unique.
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              sshPort:
                default: 22
                description: SSHPort is the port number for the SSH server.
                type: integer
              sshUser:
                description: SSHUser is the username for the SSH server.
                type: string
              storage:
                description: |-
                  Storage says whether the node may hold data. For a node of a pool it comes from the pool; for any other it
                  is left out, which means Allow.
                enum:
                - None
                - Allow
                type: string
            required:
            - clusterRef
            - role
            type: object
          status:
            description: status defines the observed state of GeassNode
            properties:
              cloud:
                description: Cloud is the machine Geass created for the node, when
                  spec.cloud asks for one.
                properties:
                  attempt:
                    description: |-
                      Attempt counts the machines made for the node before this one. It is part of the machine's name after the
                      first, so that a machine still being removed never shares a name with its replacement.
                    format: int32
                    type: integer
                  controlPlaneAccess:
                    description: |-
                      ControlPlaneAccess is the address opened for the machine in the control plane's firewall, which is closed again
                      when the machine is removed.
                    type: string
                  controlPlaneAccessFirewall:
                    description: |-
                      ControlPlaneAccessFirewall is the firewall that ControlPlaneAccess was opened on. The rule is closed on this one,
                      even if the cluster's controlPlaneFirewall has since been changed or removed.
                    properties:
                      connectionRef:
                        description: |-
                          ConnectionRef is the cloud connection (for Compute) at the provider where the control plane runs. It may be
                          another provider than the one that creates the machines.
                        minLength: 1
                        type: string
                      region:
                        description: Region is where the firewall is, for a provider
                          that answers per region.
                        type: string
                      target:
                        description: Target is the provider's id for the firewall
                          or security group, such as sg-0abc123 or a Hetzner firewall
                          id.
                        minLength: 1
                        type: string
                    required:
                    - connectionRef
                    - target
                    type: object
                  createdAt:
                    description: CreatedAt is when the provider accepted the machine.
                    format: date-time
                    type: string
                  instanceID:
                    description: InstanceID is the provider's id for the machine.
                      The machine is deleted by this id and no other.
                    type: string
                  instanceName:
                    description: |-
                      InstanceName is the name the machine is created with. It is written before the provider is called, so that
                      a machine made just before a crash is found again by its name and not made twice.
                    type: string
                  joinAttempts:
                    description: |-
                      JoinAttempts counts the times Geass set about installing K3s on the machine. Each one is written before the
                      install starts, with a write that fails if another pass got there first, which is what keeps one node from being
                      installed twice by two passes that read an old copy of it.
                    format: int32
                    type: integer
                  joinStartedAt:
                    description: |-
                      JoinStartedAt is when Geass began to install K3s on the machine. A node that is not ready a quarter of an
                      hour later is given up on.
                    format: date-time
                    type: string
                  privateIP:
                    type: string
                  problem:
                    description: |-
                      Problem names what keeps the machine from being created: Capacity (the provider has no room for it) or Quota
                      (the account is at a limit). The node's pool reads it to try another size or place.
                    enum:
                    - Capacity
                    - Quota
                    type: string
                  publicIP:
                    description: PublicIP and PrivateIP are the machine's addresses.
                    type: string
                  region:
                    type: string
                  size:
                    description: |-
                      Size and Region are what the machine was actually created with, which differs from the spec when a fallback
                      was used.
                    type: string
                  state:
                    description: State is the machine's state as the provider last
                      reported it.
                    type: string
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the GeassNode resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastHeartbeatTime:
                description: |-
                  LastHeartbeatTime is no longer updated. Kubelet keeps a heartbeat on the Kubernetes node (its Ready
                  condition and node lease), and rewriting one here once a minute for every node cost a write and an
                  event for nothing that read it.
                format: date-time
                type: string
              message:
                description: Message is a human-readable status message.
                type: string
              nodeName:
                description: NodeName is the name of the Kubernetes node.
                type: string
              phase:
                description: Phase is the current phase of the GeassNode.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
