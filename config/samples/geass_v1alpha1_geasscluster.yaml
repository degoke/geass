apiVersion: geass.geass.dev/v1alpha1
kind: GeassCluster
metadata:
  name: default
  namespace: geass-system
spec:
  version: v1
  serverURL: https://127.0.0.1:6443
  tokenSecretRef:
    name: geass-token
    namespace: geass-system
  # Set a real contact address to have Geass create the letsencrypt-prod ClusterIssuer, which every
  # HTTPS certificate is requested from. Let's Encrypt refuses placeholder domains such as example.com.
  # addons:
  #   certManager:
  #     acmeEmail: you@yourdomain.com
