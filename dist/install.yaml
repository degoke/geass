apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/name: geass
  name: geass-geass-dashboard
  namespace: geass-system
spec:
  ports:
  - name: http
    port: 8082
    protocol: TCP
    targetPort: dashboard
  selector:
