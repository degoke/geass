<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title">
  <title id="title">Geass brand board</title>
  <rect width="1440" height="960" fill="#0A0A0B"/>
  <text x="72" y="84" fill="#6F6F78" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="2">GEASS BRAND SYSTEM / 01</text>
  <g transform="translate(72 132)">
    <path d="M47.75 15.9A23 23 0 1 0 52.8 39H34" fill="none" stroke="#8B8CF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M52.8 39V51" fill="none" stroke="#8B8CF8" stroke-width="6" stroke-linecap="round"/>
    <circle cx="32" cy="32" r="4" fill="#F2F2F3"/>
    <path d="M32 28V18M28.5 34 20 39M35.5 34 44 39" fill="none" stroke="#F2F2F3" stroke-width="2.5" stroke-linecap="round"/>
    <text x="78" y="42" fill="#F2F2F3" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="560" letter-spacing="-1.4">Geass</text>
  </g>
  <text x="72" y="300" fill="#F2F2F3" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="560" letter-spacing="-2.5">Cloud on your terms.</text>
  <text x="75" y="348" fill="#A3A3AB" font-family="Inter, Arial, sans-serif" font-size="21">A calm, controlled interface for infrastructure you own.</text>
  <g transform="translate(72 430)">
    <rect width="224" height="136" rx="10" fill="#8B8CF8"/><text x="18" y="100" fill="#0A0A0B" font-family="Geist Mono, monospace" font-size="15">Signal / #8B8CF8</text>
    <rect x="240" width="224" height="136" rx="10" fill="#121214" stroke="#2A2A30"/><text x="258" y="100" fill="#F2F2F3" font-family="Geist Mono, monospace" font-size="15">Surface / #121214</text>
    <rect x="480" width="224" height="136" rx="10" fill="#F2F2F3"/><text x="498" y="100" fill="#171719" font-family="Geist Mono, monospace" font-size="15">Light / #F2F2F3</text>
    <rect x="720" width="224" height="136" rx="10" fill="#59C77A"/><text x="738" y="100" fill="#0A0A0B" font-family="Geist Mono, monospace" font-size="15">Healthy / #59C77A</text>
    <rect x="960" width="224" height="136" rx="10" fill="#E66A6A"/><text x="978" y="100" fill="#0A0A0B" font-family="Geist Mono, monospace" font-size="15">Critical / #E66A6A</text>
  </g>
  <g transform="translate(72 650)">
    <text x="0" y="0" fill="#6F6F78" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="1.7">SYMBOL IDEA</text>
    <text x="0" y="52" fill="#F2F2F3" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="550">Boundary + cluster + G</text>
    <text x="0" y="91" fill="#A3A3AB" font-family="Inter, Arial, sans-serif" font-size="17">The open boundary represents infrastructure under control,</text>
    <text x="0" y="118" fill="#A3A3AB" font-family="Inter, Arial, sans-serif" font-size="17">while the connected centre represents one coherent control plane.</text>
  </g>
  <g transform="translate(1010 662)">
    <rect width="250" height="150" rx="18" fill="#121214" stroke="#2A2A30"/>
    <g transform="translate(93 43)">
      <path d="M47.75 15.9A23 23 0 1 0 52.8 39H34" fill="none" stroke="#8B8CF8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M52.8 39V51" fill="none" stroke="#8B8CF8" stroke-width="6" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="4" fill="#F2F2F3"/>
      <path d="M32 28V18M28.5 34 20 39M35.5 34 44 39" fill="none" stroke="#F2F2F3" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
  <line x1="72" y1="892" x2="1368" y2="892" stroke="#202024"/>
  <text x="72" y="928" fill="#6F6F78" font-family="Geist Mono, monospace" font-size="13">Inter + Geist Mono  /  quiet by default  /  state before decoration</text>
