name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

# A new push to a pull request makes the run for the one before it pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    permissions:
      contents: read
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum || {
            echo "::error::go.mod or go.sum is not tidy: run go mod tidy and commit the result"
            exit 1
          }

      - name: Check linter configuration
        run: make lint-config

      - name: Run linter
        run: make lint

  crd-compat:
    permissions:
      contents: read
    name: CRD compatibility and install bundle
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The baseline release is read from git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The check reads the checked-in CRDs, so it means nothing if they are not what the types generate.
      - name: Check the CRDs are generated from the types
        run: |
          make manifests
          git diff --exit-code -- config/crd config/rbac || {
            echo "::error::config/crd or config/rbac is out of date with the API types: run make manifests and commit the result"
            exit 1
          }

      - name: Check the CRDs are compatible with the baseline release
        run: make crd-compat

      # dist/install.yaml is what people who do not use the installer apply, and it went stale for several releases because
      # nothing said so.
      - name: Check dist/install.yaml is generated from the manifests
        run: |
          make build-installer
          git diff --exit-code -- dist/install.yaml config/manager/kustomization.yaml || {
            echo "::error::dist/install.yaml is out of date with config/: run make build-installer and commit the result"
            exit 1
          }

  # The dashboard is also a package that another app mounts (docs/development.md, "The dashboard as a library"): its tests
  # run here, and so does the library build, which the operator's own build does not need.
  dashboard-ui:
    permissions:
      contents: read
    name: Dashboard package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard-ui
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard-ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tests
        run: pnpm test

      - name: Build the library
        run: pnpm build:lib

  website:
    permissions:
      contents: read
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm build

      - name: Check internal links
        run: pnpm links

      - name: Check search and sharing tags
        run: pnpm seo

  test:
    permissions:
      contents: read
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The upgrade test installs the baseline release's CRDs, which it reads from git history.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests
        env:
          # A test that cannot run (no baseline in the clone, no envtest binaries) must fail here, not skip.
          GEASS_REQUIRE_UPGRADE_TESTS: "1"
        run: |
          go mod tidy
          make test

  build:
    permissions:
      contents: read
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dashboard-ui/pnpm-lock.yaml

      - name: Set up Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build manager
        run: make build

      - name: Build geass installer
        run: make build-geass

  # The command line (and the MCP server inside it) is released for five systems, so a change that only breaks one of
  # them, a Windows-only file name, say, is caught here and not when a release is cut.
  cli:
    permissions:
      contents: read
    name: Command line for every system
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build for every system
        run: make build-cli-all GEASS_VERSION=v0.0.0-ci

      - name: Check the build reports its version
        run: test "$(bin/geass-cli-linux-amd64 version | head -n1)" = "geass v0.0.0-ci"

  scripts:
    permissions:
      contents: read
    name: Install and release scripts
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint the shell scripts
        run: shellcheck --severity=warning scripts/*.sh hack/*.sh test/scripts/*.sh

      - name: Test the install scripts
        run: sh test/scripts/install-scripts-test.sh
